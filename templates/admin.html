<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - ProjectFinder</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 25px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 8px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #00000015;
            border: 1px solid #e5e7eb;
        }

        .stat-card h3 {
            margin-top: 0;
            color: #555;
            font-size: 16px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .stats-container {
                grid-template-columns: 1fr;
            }

            .admin-container {
                margin: 20px auto;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <p>Overview of your ProjectFinder application.</p>
        </div>

        <div class="stats-container">

            <div class="stat-card">
                <h3>Total Projects</h3>
                <p class="stat-number">{{ total_projects }}</p>
            </div>

            <div class="stat-card">
                <h3>Saved Projects</h3>
                <p class="stat-number">{{ total_saved }}</p>
            </div>

            <div class="stat-card">
                <h3>Recommendation Searches</h3>
                <p class="stat-number">{{ total_searches }}</p>
            </div>

        </div>

        <a class="back-link"
           href="{{ url_for('home') }}">← Back to Home</a>

    </div>

</body>
</html>
